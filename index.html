$('base').onchange=e=>{map.removeLayer(cur);cur=BL[e.target.value].addTo(map);$('bn').textContent=e.target.selectedOptions[0].text};

const sl=Math.max(st,nice((b.getNorth()-b.getSouth())/4));
for(let k=Math.ceil(b.getSouth()/st);k*st<=b.getNorth();k++){const v=k*st,y=map.latLngToContainerPoint([v,cl.lng]).y+P;

/* ---- classification ---- */
const hex=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
function col(pal,t){const n=pal.length-1,x=Math.min(Math.max(t,0),1)*n,i=Math.min(Math.floor(x),n-1),a=hex(pal[i]),b=hex(pal[i+1]);return a.map((v,k)=>Math.round(v+(b[k]-v)*(x-i)))}

/* ---- loaders ---- */
async function mkRaster(f,t,crs){

const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const cx=cv.getContext('2d'),im=cx.createImageData(cw,ch),ci=new Uint8Array(cw*ch).fill(255);
for(let j=0;j<ch;j++)for(let i=0;i<cw;i++){const lon=lo[0]+(i+.5)/cw*dl,lat=lo[3]-(j+.5)/ch*dt;let x=lon,y=lat;if(!geo)[x,y]=pj.forward([lon,lat]);

ci[j*cw+i]=K.idx(v)}

async function readVec(fs){const z=fs.find(x=>/\.zip$/i.test(x.name));

async function mkVector(fs,t){const gj=await readVec(fs),F=gj.features||[];if(!F.length)throw Error('No features found.');

const sty=f=>{if(!K)return t.st;const c=rgb(K.C[K.idx(+f.properties[o.field])]);return{...t.st,color:t.st.fill===false?c:'#333',fillColor:c,fillOpacity:t.st.fill===false?0:.75,weight:t.st.fill===false?3:1}};
o.lyr=L.geoJSON(gj,{style:sty,pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:6,...sty(f)}),onEachFeature:(f,l)=>{const p=f.properties||{},k=Object.keys(p).slice(0,8);if(k.length)l.bindPopup(k.map(x=>`<b>${x}</b>: ${p[x]}`).join('<br>'))}});
o.leg=()=>K?{sub:'Classified by '+o.field+(t.names?' · H1 = lowest, H6 = highest vulnerability':''),items:K.C.map((c,k)=>({c:rgb(c),l:K.L[k]}))}:{sub:'',items:[{c:t.st.fill===false?t.st.color:t.st.fillColor||t.st.color,l:t.n}]};
o.bounds=o.lyr.getBounds()}};o.build();return o}
/* ---- layer management ---- */
const LY=[];let uid=0,act=0,tm;const msg=m=>$('msg').textContent=m||'';
async function addLayer(){msg();const fs=[...$('files').files];if(!fs.length)return msg('Choose file(s) first.');
const tk=$('type').value,t={...T[tk],st:{...T[tk].st},bk:$('brk').value,nc:$('ncls').value},pv=$('pal').value,crs=$('crs').value;if(pv)t.pal=pv=='custom'?[...customStops]:PALS[pv];if($('rev').checked)t.pal=[...t.pal].reverse();$('ttl').value=t.n;msg('Loading…');
try{const tf=fs.find(x=>/\.tiff?$/i.test(x.name));const o=tf?await mkRaster(tf,t,crs):await mkVector(fs,t);
Object.assign(o,{id:++uid,name:(tf||fs[0]).name,t,tk,tf,crs,pn:pv,cust:[...customStops],rev:$('rev').checked,vis:true,map:true,raster:!!tf});o.lyr.addTo(map);LY.push(o);act=o.id;map.fitBounds(o.bounds,{padding:[20,20]});msg();draw()}catch(e){console.error(e);msg(e.message||String(e))}}
function draw(){$('list').innerHTML=LY.map(o=>`<div class="card${o.id==act?' act':''}" data-id="${o.id}" onclick="setAct(${o.id})"><b>${o.name}</b><small>${o.t.n}</small>${o.raster||o.field?`<div class="gb" style="background:linear-gradient(90deg,${o.t.pal.join(',')})"></div>`:'<br>'}
<label style="display:inline;font-weight:400"><input type="checkbox" ${o.vis?'checked':''} onchange="tog(${o.id},this.checked)"> show</label>
<input type="range" min="0.1" max="1" step="0.05" value="${o.raster?o.lyr.options.opacity:.8}" oninput="opa(${o.id},this.value)" style="width:90px;vertical-align:middle">
${o.fields&&o.fields.length?`<select onchange="fld(${o.id},this.value)"><option value="">Single style</option>${o.fields.map(f=>`<option ${f==o.field?'selected':''}>${f}</option>`).join('')}</select>`:''}
${o.raster||o.field?`<br><select onchange="setPal(${o.id},this.value)" style="width:150px">${pOpts(o.pn)}</select> <label style="display:inline;font-weight:400"><input type="checkbox" ${o.rev?'checked':''} onchange="setRev(${o.id},this.checked)"> reverse</label>`:`<br>Colour <input type="color" value="${o.t.st.fillColor||o.t.st.color}" onchange="setCol(${o.id},this.value)" style="vertical-align:middle">`}
<br><button class="s" style="margin:4px 2px 0 0" onclick="map.fitBounds(LY.find(x=>x.id==${o.id}).bounds)">Zoom</button><button class="s" style="margin:4px 0 0" onclick="rem(${o.id})">Remove</button></div>`).join('');
$('legb').innerHTML=LY.filter(o=>o.vis).map(o=>{const l=o.leg();return`<div class="lg"><b>${o.t.n}</b><small>${o.name}${l.sub?' · '+l.sub:''}</small>${l.items.map(i=>`<div><svg class="sw" viewBox="0 0 26 13"><rect width="26" height="13" fill="${i.c}" stroke="#333"/></svg>${i.l}</div>`).join('')}</div>`}).join('')||'<small>Add a layer to build the legend.</small>'}
const G=i=>LY.find(x=>x.id==i);
function tog(i,v){const o=G(i);o.vis=v;v?o.lyr.addTo(map):map.removeLayer(o.lyr);o.map=v;draw()}
function opa(i,v){const o=G(i);o.raster?o.lyr.setOpacity(+v):o.lyr.setStyle({opacity:+v,fillOpacity:+v*.8})}
function fld(i,v){const o=G(i);o.field=v;try{o.build();if(o.vis)o.lyr.addTo(map);draw()}catch(e){msg(e.message)}}
function rem(i){const o=G(i);if(act==i){const r=LY.filter(x=>x.id!=i);act=r.length?r[r.length-1].id:0}map.removeLayer(o.lyr);LY.splice(LY.indexOf(o),1);draw()}
const PG={A4L:[297,210,'A4 landscape'],A4P:[210,297,'A4 portrait'],A3L:[420,297,'A3 landscape'],A3P:[297,420,'A3 portrait']};
function applyPage(){const v=$('page').value,sh=$('sheet'),st=$('pgst')||document.head.appendChild(Object.assign(document.createElement('style'),{id:'pgst'}));
if(v=='auto'){sh.style.width=sh.style.height=sh.style.overflow='';sh.style.maxWidth='';$('map').style.height='600px';st.textContent='@page{size:auto;margin:8mm}'}
else{const[w,h,n]=PG[v],k=96/25.4,W=(w-10)*k,H=(h-10)*k;sh.style.width=W+'px';sh.style.height=H+'px';sh.style.maxWidth='none';sh.style.overflow='hidden';$('map').style.height=(H-175)+'px';st.textContent=`@page{size:${n};margin:5mm}`}
map.invalidateSize();grat()}
addEventListener('beforeprint',()=>{map.invalidateSize();grat()});
const RD=L.control({position:'topleft'});RD.onAdd=()=>{const d=L.DomUtil.create('div','noprint');d.id='rd';d.textContent='Hover / click map for coordinates & pixel values';L.DomEvent.disableClickPropagation(d);return d};RD.addTo(map);
map.on('mousemove click',e=>{const{lat,lng}=e.latlng;let t=`Lat ${lat.toFixed(5)}°  Lon ${lng.toFixed(5)}°`;
LY.filter(o=>o.vis&&o.sample).forEach(o=>{const v=o.sample(lat,lng);t+=`\n${o.t.n}: ${v===null?'–':(+v.toFixed(3))+(o.t.u?' '+o.t.u:'')}`});$('rd').textContent=t});
function png(){msg('Rendering PNG…');html2canvas($('sheet'),{useCORS:true,scale:2,backgroundColor:'#fff',ignoreElements:e=>e.classList&&(e.classList.contains('noprint')||e.classList.contains('leaflet-control-zoom'))})
.then(c=>{const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=($('ttl').value||'map').replace(/\W+/g,'_')+'.png';a.click();msg($('base').value=='g'?'Note: Google tiles may be missing in PNG (browser security). Use the Esri base for PNG, or Print → PDF.':'')}).catch(e=>msg('PNG failed: '+e.message))}
function setAct(i){act=i;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('act',c.dataset.id==i))}
function applyPanel(){const o=LY.find(x=>x.id==act);if(!o||!(o.raster||o.field))return;o.pn=$('pal').value;o.rev=$('rev').checked;if(o.pn=='custom')o.cust=[...customStops];recolor(o)}
function applyDeb(){clearTimeout(tm);tm=setTimeout(applyPanel,120)}
async function recolor(o){o.t.pal=o.pn=='custom'?[...o.cust]:o.pn?PALS[o.pn]:T[o.tk].pal;if(o.rev)o.t.pal=[...o.t.pal].reverse();
try{if(o.raster){o.repaint(o.t)}
else{o.build();if(o.vis)o.lyr.addTo(map)}draw()}catch(e){msg(e.message)}}
function setPal(i,v){const o=G(i);o.pn=v;if(v=='custom')o.cust=[...customStops];recolor(o)}
function setRev(i,v){const o=G(i);o.rev=v;recolor(o)}
function setCol(i,c){const o=G(i);o.t.st={...o.t.st,color:c,fillColor:c};o.build();if(o.vis)o.lyr.addTo(map);draw()}
draw();
</script></body></html>
